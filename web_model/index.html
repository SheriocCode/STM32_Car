<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Sheriocの小车Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
      rel="stylesheet"
    />
    <script>
      // Tailwind 配置
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#165DFF",
              secondary: "#36CFC9",
              dark: "#1D2129",
              light: "#F2F3F5",
              success: "#52C41A",
              warning: "#FAAD14",
              danger: "#FF4D4F",
            },
            fontFamily: {
              inter: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .content-auto {
          content-visibility: auto;
        }
        .glass {
          background: rgba(255, 255, 255, 0.1);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .card-hover {
          transition: all 0.3s ease;
        }
        .card-hover:hover {
          transform: translateY(-5px);
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1),
            0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body
    class="bg-gradient-to-br from-dark to-slate-800 text-light font-inter min-h-screen overflow-x-hidden"
  >
    <!-- 顶部导航栏 -->
    <header class="fixed top-0 left-0 right-0 z-50 glass">
      <div
        class="container mx-auto px-4 py-3 flex items-center justify-between"
      >
        <div class="flex items-center space-x-2">
          <i class="fa fa-car text-primary text-2xl"></i>
          <h1 class="text-xl md:text-2xl font-bold">Sheriocの小车Demo</h1>
        </div>
        <div class="flex items-center space-x-6">
          <button
            class="hidden md:flex items-center space-x-1 text-sm hover:text-primary transition-colors"
          >
            <i class="fa fa-cog"></i>
            <span>设置</span>
          </button>
          <button
            class="hidden md:flex items-center space-x-1 text-sm hover:text-primary transition-colors"
          >
            <i class="fa fa-question-circle"></i>
            <span>帮助</span>
          </button>
          <div
            class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center overflow-hidden"
          >
            <img
              src="./imgs/sherioc.png"
              alt="用户头像"
              class="w-full h-full object-cover"
            />
          </div>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 pt-20 pb-16">
      <!-- 状态概览 -->
      <section class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div
          class="bg-slate-800/50 rounded-xl p-4 card-hover border border-slate-700"
        >
          <div class="flex justify-between items-start">
            <div>
              <p class="text-slate-400 text-sm">左侧电机速度</p>
              <h3 class="text-2xl font-bold mt-1" id="left-speed">-</h3>
              <p class="text-xs text-slate-400 mt-1">范围: -100 ~ 100</p>
            </div>
            <div
              class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center"
            >
              <i class="fa fa-tachometer text-primary"></i>
            </div>
          </div>
          <div class="mt-3 h-1 bg-slate-700 rounded-full overflow-hidden">
            <div
              id="left-speed-bar"
              class="h-full bg-primary transition-all duration-300"
              style="width: 50%"
            ></div>
          </div>
        </div>

        <div
          class="bg-slate-800/50 rounded-xl p-4 card-hover border border-slate-700"
        >
          <div class="flex justify-between items-start">
            <div>
              <p class="text-slate-400 text-sm">右侧电机速度</p>
              <h3 class="text-2xl font-bold mt-1" id="right-speed">-</h3>
              <p class="text-xs text-slate-400 mt-1">范围: -100 ~ 100</p>
            </div>
            <div
              class="w-10 h-10 rounded-full bg-secondary/20 flex items-center justify-center"
            >
              <i class="fa fa-tachometer text-secondary"></i>
            </div>
          </div>
          <div class="mt-3 h-1 bg-slate-700 rounded-full overflow-hidden">
            <div
              id="right-speed-bar"
              class="h-full bg-secondary transition-all duration-300"
              style="width: 50%"
            ></div>
          </div>
        </div>

        <div
          class="bg-slate-800/50 rounded-xl p-4 card-hover border border-slate-700"
        >
          <div class="flex justify-between items-start">
            <div>
              <p class="text-slate-400 text-sm">前方距离</p>
              <h3 class="text-2xl font-bold mt-1" id="distance">-</h3>
              <p class="text-xs text-slate-400 mt-1">单位: 厘米</p>
            </div>
            <div
              class="w-10 h-10 rounded-full bg-success/20 flex items-center justify-center"
            >
              <i class="fa fa-arrows-h text-success"></i>
            </div>
          </div>
          <div class="mt-3 h-1 bg-slate-700 rounded-full overflow-hidden">
            <div
              id="distance-bar"
              class="h-full bg-success transition-all duration-300"
              style="width: 0%"
            ></div>
          </div>
        </div>
      </section>

      <!-- 3D模型与详细数据 -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 3D模型展示区 -->
        <div
          class="lg:col-span-2 bg-slate-800/50 rounded-xl overflow-hidden border border-slate-700"
        >
          <div
            class="p-4 border-b border-slate-700 flex justify-between items-center"
          >
            <h2 class="font-bold flex items-center">
              <i class="fa fa-cube text-primary mr-2"></i>
              小车3D模型
            </h2>
            <div class="flex space-x-2">
              <button
                id="reset-view"
                class="text-xs px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded transition-colors"
              >
                <i class="fa fa-refresh mr-1"></i>重置视角
              </button>
              <button
                id="fullscreen"
                class="text-xs px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded transition-colors"
              >
                <i class="fa fa-expand mr-1"></i>全屏
              </button>
            </div>
          </div>
          <div class="relative">
            <canvas
              id="model-canvas"
              class="w-full h-[400px] md:h-[500px]"
            ></canvas>
            <div
              id="loading-indicator"
              class="absolute inset-0 flex items-center justify-center bg-slate-800/80"
            >
              <div class="flex flex-col items-center">
                <div
                  class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"
                ></div>
                <p class="mt-2 text-sm text-slate-400">加载模型中...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- 详细数据与控制 -->
        <div class="space-y-6">
          <!-- 数据图表 -->
          <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
            <h2 class="font-bold mb-4 flex items-center">
              <i class="fa fa-line-chart text-warning mr-2"></i>
              实时数据曲线
            </h2>
            <div class="h-[200px]">
              <canvas id="data-chart"></canvas>
            </div>
          </div>

          <!-- 系统状态 -->
          <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
            <h2 class="font-bold mb-4 flex items-center">
              <i class="fa fa-info-circle text-secondary mr-2"></i>
              系统状态
            </h2>
            <div class="space-y-3">
              <div class="flex justify-between items-center">
                <span class="text-sm text-slate-400">连接状态</span>
                <span class="flex items-center text-sm">
                  <span
                    id="connection-status"
                    class="w-2 h-2 rounded-full bg-danger mr-2"
                  ></span>
                  <span id="connection-text">未连接</span>
                </span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-sm text-slate-400">数据更新频率</span>
                <span id="update-rate" class="text-sm">- Hz</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-sm text-slate-400">模型状态</span>
                <span id="model-status" class="text-sm">未加载</span>
              </div>
            </div>
          </div>

          <!-- 控制按钮 -->
          <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
            <h2 class="font-bold mb-4 flex items-center">
              <i class="fa fa-gamepad text-primary mr-2"></i>
              控制
            </h2>
            <div class="grid grid-cols-3 gap-2">
              <!-- 第一行 -->
              <div></div>
              <button class="p-3 bg-slate-700 hover:bg-slate-600 rounded">
                <i class="fa fa-arrow-up"></i>
              </button>
              <div></div>

              <!-- 第二行 -->
              <button class="p-3 bg-slate-700 hover:bg-slate-600 rounded">
                <i class="fa fa-arrow-left"></i>
              </button>
              <button class="p-3 bg-slate-700 hover:bg-slate-600 rounded">
                <i class="fa fa-arrow-down"></i>
              </button>
              <button class="p-3 bg-slate-700 hover:bg-slate-600 rounded">
                <i class="fa fa-arrow-right"></i>
              </button>

              <!-- 第三行：停止键 -->
              <div></div>
              <button
                class="p-3 bg-red-600 hover:bg-red-500 text-white rounded"
              >
                <i class="fa fa-stop"></i>
              </button>
              <div></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-slate-900/50 border-t border-slate-800 py-4">
      <div class="container mx-auto px-4 text-center text-sm text-slate-500">
        <p>Sheriocの小车Demo &copy; 2025 | 数据刷新间隔: 20ms</p>
      </div>
    </footer>

    <!-- 图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <!-- 主脚本 -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
